[package]
name = "ephemeris"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
description = "An append-only evidence log for Proof-of-Control records"
repository = "https://github.com/Task-force-for-AI-agents-in-Healthcare/ephemeris"
# Adding the `ephemeris-bench` target made `cargo run` ambiguous, which broke
# the three `cargo run -- …` invocations in CI and every documented usage
# example. `required-features` does not disambiguate: cargo counts the target
# whether or not the feature is on. CI's `rust` job fails earlier, on the
# missing DEPS_READ_TOKEN, so nothing caught this — a masked break is exactly
# what a blocked pipeline hides.
default-run = "ephemeris"

[lib]
name = "ephemeris"
path = "src/lib.rs"

[[bin]]
name = "ephemeris"
path = "src/bin/ephemeris.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
humantime = "2"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
rand_chacha = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }

transit = { git = "https://github.com/Task-force-for-AI-agents-in-Healthcare/transit.git", rev = "3e10e13" }
occultation = { git = "https://github.com/Task-force-for-AI-agents-in-Healthcare/occultation.git", rev = "3f50bdd", optional = true }
tempfile = { version = "3", optional = true }
# Pinned to fcc86d5, not the plan's original 030686d: parallax's history was
# rewritten today (redacting a demo VM's address) and 030686d no longer
# resolves on the remote, which breaks dependency resolution for every build,
# `tee` on or off — see the `tee` feature comment below. fcc86d5 is the
# current tip and carries every symbol Task 2 needs: `ratls::expected_report_data`,
# `attest::tsm::{request_quote, request_quote_at, TSM_REPORT_DIR}`, and
# `verify::binding`.
parallax = { git = "https://github.com/Task-force-for-AI-agents-in-Healthcare/parallax.git", rev = "fcc86d5", optional = true }

[features]
# `bench` pulls occultation, which pulls blstrs and the BLS12-381 stack. None
# of that is compiled or linked unless the feature is on.
#
# It does NOT follow that a default build can ignore occultation. Cargo
# resolves the whole dependency graph — optional dependencies included —
# before it resolves features, so `cargo build` with no features still has to
# be able to FETCH the occultation git source, and fails with "failed to load
# source for dependency `occultation`" if it cannot. Two private repos are
# therefore required to build this crate at all, where before this branch one
# was: a contributor with read access to transit but not occultation could
# build before, and cannot now. Compilation is feature-gated; resolution is
# not.
bench = ["dep:occultation", "dep:tempfile"]

# `tee` pulls parallax for the attestation call and the report_data
# derivation. Off by default: the default build signs with a labelled software
# key and cannot claim hardware custody. Note that, as with `bench`, cargo
# resolves optional dependencies regardless of features, so the parallax source
# must be fetchable for any build even though nothing from it compiles.
#
# `parallax/attest` is required alongside `dep:parallax`: parallax gates its
# own `attest` module (which is where `tsm::request_quote` lives) behind an
# `attest` feature of its own, off by default there for the same reason ours
# is off by default here — it pulls rcgen and the TLS stack. Without
# forwarding it, `parallax::attest` does not exist and `src/tee.rs` fails to
# compile under `--features tee`.
tee = ["dep:parallax", "parallax/attest"]

# `serve` needs no new dependency: the listener is std's UnixListener and a
# minimal HTTP/1.1 reader. See the design's transport section for why this is
# not hyper+tokio — the crate is blocking end to end, fsync is ~3.4ms, and the
# measured ceiling is ~310 batches/sec set by durability rather than transport.
serve = []

[[bin]]
name = "ephemeris-bench"
path = "src/bin/ephemeris-bench.rs"
required-features = ["bench"]

[dev-dependencies]
tempfile = "3"
