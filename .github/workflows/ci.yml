name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The `transit`, `occultation` and `parallax` git dependencies (the
      # second only under the `bench` feature, the third only under `tee`)
      # live in private sibling repos, and a workflow's default GITHUB_TOKEN
      # is scoped to THIS repository only, so it cannot read any of them. This
      # needs a token with read access to the org's repos, stored as the
      # DEPS_READ_TOKEN secret.
      #
      # The insteadOf rewrite below only takes effect because
      # .cargo/config.toml sets `net.git-fetch-with-cli = true` — cargo's
      # default libgit2 transport ignores git's url.*.insteadOf rewriting
      # entirely, so it would silently keep trying the unauthenticated
      # https://github.com/... URL and fail with the opaque "could not read
      # Username" error this step exists to prevent. That coupling is
      # load-bearing: deleting `git-fetch-with-cli = true` from
      # .cargo/config.toml silently breaks this authentication fix, and
      # nothing here would catch it happening.
      #
      # The rewrite is wholesale (it targets all of https://github.com/, not
      # one repo), so one token and one step already cover all three private
      # dependencies — neither occultation nor parallax needed a new auth step
      # here.
      - name: authenticate to the private dependency repos
        env:
          DEPS_READ_TOKEN: ${{ secrets.DEPS_READ_TOKEN }}
        run: |
          if [ -z "${DEPS_READ_TOKEN}" ]; then
            echo "::error::DEPS_READ_TOKEN is not set. ephemeris depends on the"
            echo "::error::PRIVATE transit, occultation and parallax repos and"
            echo "::error::the default GITHUB_TOKEN cannot read them. Create a"
            echo "::error::fine-grained PAT with read access to the org's"
            echo "::error::repos and add it as the DEPS_READ_TOKEN repository"
            echo "::error::secret."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${DEPS_READ_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

      # `--all-targets` does NOT imply `--doc` — cargo excludes doctests from
      # it. The `compile_fail` doctest on `SignedRoot::render` is the check
      # that a forged hardware-custody literal does not compile, which is this
      # branch's central safety property, and without this line it would run in
      # CI only as a side effect of the feature steps below. If those were ever
      # skipped or gated, the property would stop being checked silently.
      - run: cargo test --doc

      # Feature-gated code that CI does not build stops compiling quietly.
      # `bench` pulls occultation (see the comment on the auth step above for
      # why that needs no new CI step) and the whole BLS12-381 stack behind
      # it, so it is checked separately from the default build/test above.
      - run: cargo clippy --all-targets --features bench -- -D warnings
      - run: cargo test --features bench

      # The same argument for `tee`, which pulls parallax and its attest
      # feature. What this gate proves is narrow and worth stating: that the
      # hardware path still compiles and that its failure paths still fail the
      # way the tests say. It proves nothing about a real TDX guest. This
      # runner is not one, there is no configfs-tsm report directory on it,
      # and `TeeSigner::generate` has never returned a quote anywhere. Do not
      # read a green tick here as "attestation works".
      - run: cargo clippy --all-targets --features tee -- -D warnings
      - run: cargo test --features tee

      # `serve` is the UDS listener behind `--features serve`. Off by
      # default, same reasoning as `bench`/`tee` above: feature-gated code
      # CI does not build stops compiling quietly. This gate includes the A9
      # property checked end to end over the socket
      # (`a_rewritten_and_relinked_log_still_fails_a_consistency_check_over_the_socket`
      # in `tests/serve_proofs.rs`) — a served consistency proof for a
      # rewritten-and-relinked log must not verify against a root published
      # before the rewrite. It proves the route and its wire format, not that
      # anything has ever driven this listener in production: nothing here
      # has been exercised by the real `transit guard`, only by this
      # repository's own tests.
      - run: cargo clippy --all-targets --features serve -- -D warnings
      - run: cargo test --features serve

      # A benchmark that cannot run is not a benchmark. This asserts the
      # harness produces a well-formed result for every topology; it asserts
      # NO threshold, because a performance assertion on a shared runner is a
      # test of that runner's hardware and will flake.
      #
      # The shape check uses jq rather than an inline Python heredoc: a
      # heredoc nested inside this bash `run:` block, itself nested inside
      # YAML, is exactly the kind of indentation-sensitive construct that
      # breaks silently on reformatting, and jq is already present on
      # GitHub's ubuntu-latest runners.
      - name: the harness still produces a result for every topology
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          cargo run --release --features bench --bin ephemeris-bench -- \
            --out "$out" --agents 2 --claims-per-agent 10
          for t in global per-agent joint; do
            f="$out/$t.json"
            [ -s "$f" ] || { echo "::error::no results file for $t"; exit 1; }
            jq -e '
              (.throughput | length > 0) and
              (.linkability | length > 0) and
              (.host.logical_cores > 0) and
              ([.throughput[] | (.fsyncs > 0 and .claims > 0)] | all)
            ' "$f" >/dev/null \
              || { echo "::error::$f failed its shape check (empty throughput/linkability, a run with zero fsyncs or claims, or missing host provenance)"; exit 1; }
            echo "$f: ok"
          done

      # Phase 1's central claim, run end to end against the built binary
      # rather than only in-process: a log that rewrites a past record and
      # relinks the chain is internally perfect, and must still fail against a
      # root published before the rewrite. If `verify` ever exits 0 here, the
      # A9 defence has regressed no matter what the unit tests say.
      # The README's headline console block is generated, not typed. If the
      # example stops producing it, the README is making a claim the code no
      # longer supports.
      - name: the rewrite demonstration still demonstrates something
        shell: bash
        run: |
          set -euo pipefail
          out="$(cargo run --quiet --example rewrite)"
          echo "$out"
          grep -q 'chain verifies internally:      true' <<<"$out" \
            || { echo "::error::the rewritten log no longer passes its internal checks — the demonstration has lost its point"; exit 1; }
          grep -q 'accepted with no prior root:    true' <<<"$out" \
            || { echo "::error::the rewrite is no longer accepted without a prior root; the tool's stated limitation changed silently"; exit 1; }
          grep -q 'REFUSED' <<<"$out" \
            || { echo "::error::the rewrite was NOT refused against the published prior root — A9 has regressed"; exit 1; }

      - name: a rewritten log fails against a prior root
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          cat > "$dir/claim.json" <<'JSON'
          {"action_id":"a-0","agent_id":"did:web:x","initiating_user":"user:alice",
           "interception_point":"PRE_CALL_TOOL_INVOCATION","target_resource":"/v1/charges",
           "canonical_snapshot_hash":"54c323d3","policy_bundle_hash":"a7713be5",
           "verdict":"ALLOW","nonce":"n-0"}
          JSON
          cargo run --quiet -- append --dir "$dir" --claim "$dir/claim.json" --now 1700000000
          cargo run --quiet -- root --dir "$dir" | tee "$dir/root.txt"
          grep -q 'C7.3.3' "$dir/root.txt" \
            || { echo "::error::a published root did not print what it fails to defend"; exit 1; }
          set +e
          cargo run --quiet -- verify --dir "$dir" \
            --prior-size 1 --prior-root "$(printf 'aa%.0s' $(seq 32))"
          code=$?
          set -e
          [ "$code" -eq 1 ] \
            || { echo "::error::verify exited $code against a contradicting prior root, expected 1"; exit 1; }

  # The paper is built to prove it still compiles. It is deliberately NOT
  # diff-gated against the committed PDF: tectonic stamps a CreationDate, so
  # two builds of identical sources differ byte-for-byte and the check would
  # fail on every run. Keeping paper/main.pdf current is a manual step.
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: WtfJoke/setup-tectonic@v3
      # No `-Z shell-escape`: this preamble omits `minted`, so the build has
      # no pygments dependency to satisfy here.
      - run: cd paper && tectonic main.tex
